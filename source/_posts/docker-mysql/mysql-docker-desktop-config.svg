<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Docker Desktop 运行 MySQL 配置示意图</title>
  <desc id="desc">展示 MySQL 镜像、容器名称、端口、数据卷和 root 密码环境变量。</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f4f8ff"/>
      <stop offset="1" stop-color="#e8f2ff"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#15345f" flood-opacity="0.14"/>
    </filter>
    <style>
      .ui { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif; }
      .label { fill: #5d6b7d; font-size: 21px; font-weight: 600; }
      .value { fill: #152238; font-size: 23px; font-weight: 600; }
      .hint { fill: #6b7d94; font-size: 18px; }
    </style>
  </defs>

  <rect width="1200" height="760" fill="url(#background)"/>
  <circle cx="1070" cy="105" r="155" fill="#d9e9ff" opacity="0.7"/>
  <circle cx="95" cy="690" r="180" fill="#d8f4ef" opacity="0.65"/>

  <g class="ui" filter="url(#shadow)">
    <rect x="110" y="62" width="980" height="636" rx="28" fill="#ffffff"/>
  </g>

  <g class="ui">
    <rect x="110" y="62" width="980" height="108" rx="28" fill="#10233f"/>
    <path d="M110 142h980v28H110z" fill="#10233f"/>
    <g transform="translate(154 92)">
      <rect x="0" y="14" width="66" height="34" rx="8" fill="#4ca9e8"/>
      <rect x="9" y="3" width="10" height="10" rx="2" fill="#4ca9e8"/>
      <rect x="24" y="3" width="10" height="10" rx="2" fill="#4ca9e8"/>
      <rect x="39" y="3" width="10" height="10" rx="2" fill="#4ca9e8"/>
      <path d="M66 23c15 0 22-8 27-16 4 11 1 21-8 27-10 7-23 8-38 7" fill="#4ca9e8"/>
      <circle cx="78" cy="22" r="2.5" fill="#10233f"/>
    </g>
    <text x="270" y="112" fill="#ffffff" font-size="30" font-weight="700">Run a new container</text>
    <text x="270" y="143" fill="#a9bfdc" font-size="21">mysql:latest</text>

    <text class="label" x="155" y="220">Container name</text>
    <rect x="155" y="236" width="890" height="58" rx="10" fill="#f8fafc" stroke="#cfd9e7" stroke-width="2"/>
    <text class="value" x="180" y="273">mysql-local-dev</text>

    <text class="label" x="155" y="341">Ports</text>
    <rect x="155" y="357" width="890" height="58" rx="10" fill="#f8fafc" stroke="#cfd9e7" stroke-width="2"/>
    <text class="value" x="180" y="394">3306</text>
    <text class="hint" x="890" y="393">→ 3306/tcp</text>

    <text class="label" x="155" y="462">Volumes</text>
    <rect x="155" y="478" width="500" height="58" rx="10" fill="#f8fafc" stroke="#cfd9e7" stroke-width="2"/>
    <text class="value" x="180" y="515" font-size="20">/Users/developer/docker-data/mysql</text>
    <path d="M680 507h36" stroke="#72a7db" stroke-width="3" stroke-linecap="round"/>
    <path d="M707 499l9 8-9 8" fill="none" stroke="#72a7db" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="740" y="478" width="305" height="58" rx="10" fill="#f8fafc" stroke="#cfd9e7" stroke-width="2"/>
    <text class="value" x="765" y="515">/var/lib/mysql</text>

    <text class="label" x="155" y="583">Environment variable</text>
    <rect x="155" y="599" width="500" height="58" rx="10" fill="#f8fafc" stroke="#cfd9e7" stroke-width="2"/>
    <text class="value" x="180" y="636" font-size="20">MYSQL_ROOT_PASSWORD</text>
    <rect x="680" y="599" width="365" height="58" rx="10" fill="#eefaf6" stroke="#77c9ac" stroke-width="2"/>
    <text class="value" x="705" y="636">Aa123456</text>

    <rect x="892" y="674" width="153" height="54" rx="12" fill="#3478d4"/>
    <text x="968.5" y="709" text-anchor="middle" fill="#ffffff" font-size="22" font-weight="700">Run</text>
  </g>
</svg>
